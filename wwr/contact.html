    <main>
        <section class="Company info">
            <h1>Summer River Expedition</h1>
            <p>20 ugbor village road GRA,</p>

            <p>+234 8140927427</p>
            <p>info@summerriverexpedition.com</p>
        </section>
        <section class="contact-section">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3965.9886541375017!2d5.604419873990474!3d6.265221693723441!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1040d10971c5b8dd%3A0xe48a16e2e5dd6c60!2sOpp.%20Ugbor%20Market%2C%2020%20Ugbor%20Village%20Rd%2C%20Oka%2C%20Benin%20City%20300102%2C%20Edo%2C%20Nigeria!5e0!3m2!1sen!2suk!4v1791633467264!5m2!1sen!2suk" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="contact-form" action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                
               <fieldset>
                <legend>Message Purpose</legend>
                <label class="radio-option">
                    <input type="radio" id="general" name="purpose" value="general" required>
                    General Enquiry
                
                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    Reservation Question
                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    Website suggestion
                </label>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to Newsletter</label>
                <button type="send-feedback">Get in Touch</button>
               </fieldset>
               <label for="message"></label>
               <textarea id="message" name="message" placeholder="Type here......" required>
               </textarea>
               
            </form>
        </section>
            

            <section>
            <h2>We Are Here To Serve You</h2>
